
star:
  rstar: 696.340  #the radius of the star in Mm
  tile_width: 9 #the width of the tile in Mm - recommend not changing this as it matches the simulation box size
  subtile_width: 0.9 #the width of subtiles used at the limb at the star
  inc: 90 #inclination of the star in degrees

  #solar differential rotation parameters in degrees per day (Snodgrass & Ulrich 1990)
  A: 14.713 #zero this if you want no rotational velocity
  B: -2.396 #zero B and C to remove differential rotation
  C: -1.787


